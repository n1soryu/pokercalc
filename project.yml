name: PokerNight
options:
  bundleIdPrefix: com.uzayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PokerCore:
    path: PokerCore
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "ZMY7V3G25Z"
targets:
  PokerNight:
    type: application
    platform: iOS
    sources:
      - PokerNight
    dependencies:
      - package: PokerCore
    settings:
      base:
        PRODUCT_NAME: PokerNight
        PRODUCT_BUNDLE_IDENTIFIER: com.uzayer.pokernight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "PokerCalc"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PokerNightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PokerNightTests]
    dependencies:
      - target: PokerNight
      - package: PokerCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.uzayer.pokernight.tests
schemes:
  PokerNight:
    build:
      targets:
        PokerNight: all
    run:
      # This app is commonly run from Xcode as the installed game-night build.
      # Use optimized code so Swift runtime startup does not dominate launch.
      config: Release
    test:
      targets: [PokerNightTests]
